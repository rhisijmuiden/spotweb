# Spotweb appliance (Proxmox LXC template)
#
# Spotweb lives in /var/www/spotweb, its database settings in
# /var/www/spotweb-config (outside the webroot). PHP runs in the "spotweb"
# PHP-FPM pool. Visitor addresses behind Cloudflare are restored in
# /etc/nginx/conf.d/cloudflare-realip.conf.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/spotweb;
    index index.php;

    client_max_body_size 16m;
    server_tokens off;
    # Relative redirects (/admin -> /admin/), so they keep https behind
    # Cloudflare or another reverse proxy.
    absolute_redirect off;

    # Spotweb is installed on the first start of the container
    # (spotweb-firstboot), so the web installer is not needed.
    location = /install.php { return 404; }

    # Newznab API for Prowlarr, Sonarr and Radarr, without a redirect.
    location = /api { rewrite ^ /api/index.php last; }

    # Also serves the Newznab API for Prowlarr, Sonarr and Radarr at /api
    # (api/index.php, or index.php for paths ending in /api).
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Internal folders, git data and dot files stay private.
    location ~ ^/(lib|bin|utils|locales|vendor|cache|tests|contrib|docs|changelog)/ { deny all; }
    location ~ /\.(?!well-known/) { deny all; }
    location ~ \.(sql|sqlite3|ser|log|md|lock|dist)$ { deny all; }
    location = /composer.json { deny all; }

    # Theme assets carry ?v=<version>, so they can be cached for long.
    location ~* \.(css|js|png|jpe?g|gif|svg|ico|woff2?|ttf)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include snippets/spotweb-php.conf;
    }
}
